name: Deploy to Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessary for subtree splits

      - name: Setup Node.js
        uses: actions/setup-node@v4  # Use v4 for better compatibility
        with:
          node-version: '22'        # This forces the cloud runner to use Node 22

      - name: Build and Deploy
        run: |
          # Use the actor (username) who triggered the run for git config
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"

          # Install dependencies
          npm install

          # Build the project
          npm run build

          echo 'Deploying to gh-pages...'

          # Force add the dist folder (since it's usually gitignored)
          git add dist -f
          git commit -m 'Deploying build from GitHub Action' 

          # The Magic: Split the dist folder into the gh-pages branch and force push
          git push origin `git subtree split --prefix dist main`:gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
